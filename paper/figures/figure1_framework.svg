<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="360" y="25" text-anchor="middle" font-size="13" font-weight="600" fill="#333">Three-level evaluation framework (locked configuration: XGBoost, compact features, raw SMILES)</text>
  
  <!-- Level 2: Random vs Scaffold -->
  <rect x="40" y="45" width="300" height="85" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.8"/>
  <text x="190" y="65" text-anchor="middle" font-size="11" font-weight="600" fill="#0C447C">Level 2: Split comparison</text>
  <text x="190" y="82" text-anchor="middle" font-size="9.5" fill="#185FA5">Random 5×5 CV → MCC = 0.670</text>
  <text x="190" y="96" text-anchor="middle" font-size="9.5" fill="#185FA5">Scaffold 5×5 CV → MCC = 0.624</text>
  <text x="190" y="115" text-anchor="middle" font-size="9" font-weight="600" fill="#185FA5">Δ = 0.046 (split effect)</text>
  
  <!-- Level 1: Scaffold test -->
  <rect x="380" y="45" width="300" height="85" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.8"/>
  <text x="530" y="65" text-anchor="middle" font-size="11" font-weight="600" fill="#085041">Level 1: Scaffold-split test</text>
  <text x="530" y="82" text-anchor="middle" font-size="9.5" fill="#0F6E56">Train on 80% scaffolds</text>
  <text x="530" y="96" text-anchor="middle" font-size="9.5" fill="#0F6E56">Test on held-out 20% → MCC = 0.470</text>
  <text x="530" y="115" text-anchor="middle" font-size="9" fill="#0F6E56">Bootstrap 95% CI: [0.434, 0.502]</text>

  <!-- Arrow down -->
  <line x1="360" y1="130" x2="360" y2="165" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/>
  
  <!-- Level 3: Cross-domain -->
  <rect x="100" y="170" width="520" height="105" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.8"/>
  <text x="360" y="192" text-anchor="middle" font-size="11" font-weight="600" fill="#791F1F">Level 3: Cross-source-domain leave-domain-out (Ames only)</text>
  
  <!-- Drug → Industrial -->
  <rect x="130" y="205" width="220" height="55" rx="6" fill="#F7C1C1" stroke="#E24B4A" stroke-width="0.5"/>
  <text x="240" y="222" text-anchor="middle" font-size="9.5" font-weight="500" fill="#791F1F">Drug → Industrial</text>
  <text x="240" y="237" text-anchor="middle" font-size="9" fill="#A32D2D">Train: 6,416 (pos 58.3%)</text>
  <text x="240" y="251" text-anchor="middle" font-size="9" fill="#A32D2D">Test: 7,144 (pos 3.0%) → MCC = 0.234</text>
  
  <!-- Industrial → Drug -->
  <rect x="370" y="205" width="220" height="55" rx="6" fill="#F7C1C1" stroke="#E24B4A" stroke-width="0.5"/>
  <text x="480" y="222" text-anchor="middle" font-size="9.5" font-weight="500" fill="#791F1F">Industrial → Drug</text>
  <text x="480" y="237" text-anchor="middle" font-size="9" fill="#A32D2D">Train: 7,144 (pos 3.0%)</text>
  <text x="480" y="251" text-anchor="middle" font-size="9" fill="#A32D2D">Test: 6,416 (pos 58.3%) → MCC = 0.122</text>

  <!-- Bottom: hierarchy summary -->
  <rect x="100" y="300" width="520" height="60" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.8"/>
  <text x="360" y="322" text-anchor="middle" font-size="11" font-weight="600" fill="#633806">Overestimation hierarchy (this benchmark)</text>
  <text x="360" y="342" text-anchor="middle" font-size="10" fill="#854F0B">Source-domain composition (Δ = 0.390)  >>  Split method (Δ = 0.046)  ≈  Algorithm choice (range = 0.063)</text>
  
  <line x1="360" y1="275" x2="360" y2="298" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/>
</svg>
